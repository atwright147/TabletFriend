name: Build release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose ZIPs will be replaced using the selected branch
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}

permissions:
  contents: read

jobs:
  test:
    name: Run regression tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Verify target release exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
            throw 'An existing release tag is required.'
          }
          gh release view --json tagName -- "$env:RELEASE_TAG"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test TabletFriend/TabletFriend.sln --configuration Release

  build:
    name: Package ${{ matrix.runtime }}
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    defaults:
      run:
        shell: pwsh
    env:
      RUNTIME: ${{ matrix.runtime }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish self-contained application
        run: >-
          dotnet publish TabletFriend/TabletFriend/TabletFriend.csproj
          --configuration Release
          --runtime "$env:RUNTIME"
          --self-contained true
          --output "artifacts/$env:RUNTIME"
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Package application
        run: |
          $publishPath = Join-Path 'artifacts' $env:RUNTIME
          foreach ($required in @('TabletFriend.exe', 'coreclr.dll', 'PresentationFramework.dll', 'files/layouts/default.yaml', 'files/themes/default.yaml')) {
            if (-not (Test-Path -LiteralPath (Join-Path $publishPath $required))) {
              throw "Missing release file: $required"
            }
          }
          Compress-Archive -Path "$publishPath/*" -DestinationPath "artifacts/TabletFriend-$env:RUNTIME.zip" -Force

      - name: Attach package to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload --clobber -- "$env:RELEASE_TAG" "artifacts/TabletFriend-$env:RUNTIME.zip"
